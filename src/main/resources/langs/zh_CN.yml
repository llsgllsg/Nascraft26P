discord_wiki_inventory: "## :school_satchel: 库存\n> 一旦你关联账户，**你在游戏内的金钱将与你的 Discord 账户共享**，反之亦然，**你还会获得一个虚拟库存**，你可以在其中存放通过 Discord 购买的物品。每个栏位最多可以存放 **999 个同一种物品**。两个栏位不能存放同一种材质。你可以通过按下 :school_satchel: **库存** 按钮购买更多栏位并查看库存内容和价值。"
discord_wiki_balance: "## :coin: 余额\n> 如果你已关联账户，:coin: **余额** 按钮会展示你的财务状况统计。它会显示**你的 Discord 和 Minecraft 账户共享的钱包**，以及其他信息，例如你**资产组合的当前价值**和**在经纪商管理下的资金**。"
discord_wiki_alerts: "## :bell: 提醒\n> 如果你对某个物品感兴趣，你可以设置一个**提醒**，当物品价格达到**你预先设定的阈值**时，你会收到一条**私信**。要设置你自己的提醒，请使用 :bell:**提醒**"

