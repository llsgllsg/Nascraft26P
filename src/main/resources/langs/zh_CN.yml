discord_wiki: "# :information_source: 市场信息\n> 使用这个频道，你可以在**不进入游戏的情况下购买/出售物品以及做更多事情！** 要开始使用，你必须先关联你的 Discord 账户，点击 :link: **账户关联** 按钮并按照说明操作即可。\n## 点击一个分类了解更多"
