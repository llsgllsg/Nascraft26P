name: 构建 Nascraft

# 每次 push（任意分支）、Pull Request 以及手动触发，都完整构建三个目标。
on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支上新的推送会取消还没跑完的旧构建。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 两个 JDK 都要装，顺序不能反：
      #   * Gradle 自己必须跑在 JDK 21 上 —— Gradle 8.14.3 内嵌的 Kotlin DSL
      #     编译器解析不了 Java 25 的版本号；
      #   * 26.2 / 26.3 目标通过 Java 工具链用 JDK 25 编译 javac。
      # setup-java 最后一次调用决定 JAVA_HOME，所以 21 放在最后。
      - name: 设置 JDK 25（26.2 / 26.3 的编译工具链）
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 设置 JDK 21（Gradle 运行环境）
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 准备构建配置
        run: |
          # gradlew 在仓库里可能没有可执行位（Windows 提交的常见问题），显式补上。
          chmod +x gradlew

          # gradle.properties 里的本地 Clash 代理和 D:/Zulu 工具链路径只适用于作者本机，
          # 在 Actions 上留着会让依赖下载全部失败，先把这些行剔掉，
          # 再写入 runner 上真实存在的两个 JDK 路径。
          sed -i '/^systemProp\..*roxy/d' gradle.properties
          sed -i '/^org\.gradle\.java\.installations\.paths/d' gradle.properties

          JDK25="${JAVA_HOME_25_X64:-}"
          JDK21="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          if [ -z "$JDK25" ] || [ -z "$JDK21" ]; then
            echo "::error::找不到 JDK 路径（JDK25='$JDK25' JDK21='$JDK21'）"
            exit 1
          fi
          echo "org.gradle.java.installations.paths=${JDK25},${JDK21}" >> gradle.properties

          echo "Gradle 运行在：$JAVA_HOME"
          cat gradle.properties

      # 不带 clean，一次构建出三个 jar；三个目标文件名不同，会同时留在 build/libs。
      # 同时跑 test：连接复用的回归测试（见 ConnectionReuseTest）只有真的跑起来才有意义。
      - name: 构建三个目标
        run: |
          set -e
          for target in 1.21.11 26.2 26.3; do
            echo "::group::构建并测试 MC $target"
            ./gradlew test shadowJar "-PmcTarget=$target" --console=plain
            echo "::endgroup::"
          done

      - name: 校验产物
        run: |
          set -e
          VERSION=$(grep -m1 '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "版本号：$VERSION"
          # 传给后面的上传步骤，让它按精确文件名取产物
          echo "NASCRAFT_VERSION=$VERSION" >> "$GITHUB_ENV"
          for target in 1.21.11 26.2 26.3; do
            JAR="build/libs/Nascraft-${VERSION}-${target}.jar"
            test -f "$JAR" || { echo "::error::缺少产物 $JAR"; exit 1; }

            # issue #3 防回归：确认随包依赖真的被 shade 进 jar 了。
            # 少依赖的 jar 一样能"构建成功"，但装到服务器上会直接
            # NoClassDefFoundError: org/bstats/charts/CustomChart。
            for entry in \
              me/bounser/bstats/charts/CustomChart.class \
              me/bounser/bstats/bukkit/Metrics.class \
              xyz/xenondevs/invui/gui/AbstractGui.class \
              me/bounser/nbtapi/NBTItem.class
            do
              unzip -l "$JAR" | grep -q "$entry" \
                || { echo "::error::$JAR 缺少随包依赖 $entry"; exit 1; }
            done
            ls -l "$JAR"
          done
          echo "三个目标的 jar 都已生成，且随包依赖完整。"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Nascraft-build
          # 精确列出三个产物，不要用 build/libs/Nascraft-*.jar 这种通配符：
          # 万一 jars 目录里还有没打依赖的普通 jar（Nascraft-<版本>.jar），
          # 通配符会把它一起传上来，正是 issue #3 那类坏包的来源。
          path: |
            build/libs/Nascraft-${{ env.NASCRAFT_VERSION }}-1.21.11.jar
            build/libs/Nascraft-${{ env.NASCRAFT_VERSION }}-26.2.jar
            build/libs/Nascraft-${{ env.NASCRAFT_VERSION }}-26.3.jar
          if-no-files-found: error
