# ------------------------------------------------------------------
# Nascraft build configuration
# ------------------------------------------------------------------

# 插件版本号（唯一来源）。
# 构建产物文件名 Nascraft-<version>-<mcTarget>.jar 和 plugin.yml 的 version
# 都取自这里，改版本只需要改这一行。
version=26.3.2

# ------------------------------------------------------------------
# 以下两项只适用于作者本机，GitHub Actions 上没有这些路径/代理。
# .github/workflows 里的构建步骤会先把这些行删掉再构建。
# ------------------------------------------------------------------

# Toolchain locations. paper-api 26.2 / 26.3 是 Java 25 编译的，
# 所以 26.2、26.3 目标需要 zulu-25；1.21.11 目标用 zulu-21。

# Direct outbound connections from Java are intercepted; route all
# dependency resolution through the local Clash proxy.
org.gradle.java.installations.paths=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/25.0.4-1/x64,/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/21.0.12-1/x64
