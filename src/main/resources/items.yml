# Nascraft items.yml - ${project.version}

# 你可以手动编辑此文件，或使用 /nascraft editmarket 命令编辑
items:
  # 物品的标识符（大多数情况下为材质名）。
  stone:
    # 必填：初始价格。当市场开始自行确定估值后，该值将被忽略。
    initial-price: 0.1

    # 可选：物品的显示名称。如果未指定，将显示材质名称（首字母大写且不带下划线）。
    alias: '石头'

    # 可选：你可以为每个物品设置一个支撑位、一个压力位，或两者兼有。
    # 在本例中，该物品的价格会在 0.03 - 0.5 之间随机波动，并且当价格因玩家行为而偏离
    # 该区间时，会尝试回到这个区间。
    support: 0.03
    resistance: 0.5

    # 可选：弹性决定了物品对库存变化的反应倾向。
    # 数值越低，物品需要更多交易才会发生价格变化；数值越高，价格越容易变化。
    # 这对圆石等常见物品尤其有用。弹性越低，玩家需要买卖更多次才能影响价格。
    elasticity: 0.5

    # 可选：噪声强度决定了随机波动的幅度。
    noise-intensity: 1.4

    # 可选：设置硬性价格上下限，以及是否应限制交易。
    # limit:
    #  high: 10
    #  low: 0.1
    #  restricted: true

    # 可选：为每个物品设置不同的税费：
    tax:
      # 购买圆石时征收 5% 的税。
      buy: 0.05
      # 出售圆石时征收 10% 的税。
      sell: 0.1

    # 可选：将该物品的价格排除在 CPI（消费者物价指数）的计算之外。
    # exclude-from-cpi: true

    # 可选：为该物品设置不同于默认货币的货币。
    # currency: 'player-points'

    # 可选：子物品。这些物品的价格由其父物品决定。
    child:
      stone_slab:
        # 制作一个圆石台阶只需要半个圆石方块，因此台阶的价格是圆石价格的一半。
        # 因此，初始价格将是圆石价格的 0.5 倍，在本例中一个台阶为 0.1*0.5 = 0.05。
        multiplier: 0.5
        alias: '石头台阶'
      stone_stairs:
        # 制作一个圆石楼梯需要六个圆石方块，但我们只能得到四个楼梯。
        # 因此，价格将是圆石价格的 6/4 = 3/2 = 1.5 倍。
        #
        # 注意：请注意，这个逻辑并非必需，你也可以选择把楼梯价格设为圆石价格的十倍。
        # 但这并不合理，而且很可能会让玩家利用过高的估价获利。
        multiplier: 1.5
        alias: '石头楼梯'
      cobblestone_wall:
        # 消耗 6 个，得到 6 个。因此比例是 6/6 = 1/1 = 1。
        multiplier: 1
  andesite:
