# ------------------------------------------------------------------
# Nascraft build configuration
# ------------------------------------------------------------------

# 插件版本号（唯一来源）。
# 构建产物文件名 Nascraft-<version>.jar 和 plugin.yml 的 version
# 都取自这里，改版本只需要改这一行。
version=26.4.5.3

# ------------------------------------------------------------------
# 以下两项只适用于作者本机，GitHub Actions 上没有这些路径/代理。
# .github/workflows 里的构建步骤会先把这些行删掉再构建。
# ------------------------------------------------------------------

# Toolchain locations. 编译 toolchain 固定 JDK 25（--release 21 出 Java 21 字节码），
# Gradle 守护进程必须用 zulu-21 启动（Gradle 8.14.3 的 Kotlin DSL 不认 Java 25）。

# Direct outbound connections from Java are intercepted; route all
# dependency resolution through the local Clash proxy.
org.gradle.java.installations.paths=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/25.0.5-8/x64,/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/21.0.13-9/x64
