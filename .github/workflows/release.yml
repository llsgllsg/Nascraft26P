name: 发布 Release

# 两种触发方式：
#   1. 推一个 v* tag（版本号直接取自 tag）；
#   2. 手动触发，填版本号或选递增方式，工作流会改 gradle.properties、
#      提交、打 tag、推送，然后构建并发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '指定版本号（例如 26.3）。填了就按它发布，忽略下面的递增类型。'
        required: false
        type: string
      bump_type:
        description: '版本递增类型（仅在未指定版本号时生效）'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - major
          - hotfix

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（含完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 与构建工作流一致：先装 25 再装 21，保证 Gradle 跑在 JDK 21 上。
      - name: 设置 JDK 25（26.2 / 26.3 的编译工具链）
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 设置 JDK 21（Gradle 运行环境）
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 准备构建配置
        run: |
          sed -i '/^systemProp\..*roxy/d' gradle.properties
          sed -i '/^org\.gradle\.java\.installations\.paths/d' gradle.properties

          JDK25="${JAVA_HOME_25_X64:-}"
          JDK21="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          if [ -z "$JDK25" ] || [ -z "$JDK21" ]; then
            echo "::error::找不到 JDK 路径（JDK25='$JDK25' JDK21='$JDK21'）"
            exit 1
          fi
          echo "org.gradle.java.installations.paths=${JDK25},${JDK21}" >> gradle.properties
          cat gradle.properties

      - name: 计算版本号
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump_type }}
        run: |
          # 当前版本：优先取最新 tag；仓库还没有 tag 时回退到 gradle.properties，
          # 否则会把已有版本当成 1.0.0 重新算一遍。
          LATEST_TAG=$(git tag --sort=-v:refname | head -1)
          if [ -n "$LATEST_TAG" ]; then
            CUR_VER="${LATEST_TAG#v}"
          else
            CUR_VER=$(grep -m1 '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
            echo "仓库尚无 tag，以 gradle.properties 的 ${CUR_VER} 作为基线"
          fi

          CUR_MAJOR=$(echo "$CUR_VER" | cut -d. -f1); CUR_MAJOR=${CUR_MAJOR:-26}
          CUR_MINOR=$(echo "$CUR_VER" | cut -d. -f2); CUR_MINOR=${CUR_MINOR:-0}
          CUR_PATCH=$(echo "$CUR_VER" | cut -d. -f3); CUR_PATCH=${CUR_PATCH:-0}
          echo "当前版本：${CUR_MAJOR}.${CUR_MINOR}.${CUR_PATCH}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # tag 推送触发：直接用 tag 里的版本，不递增
            NEW_VER="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            NEW_VER="${INPUT_VERSION#v}"
          else
            case "$INPUT_BUMP" in
              major)  NEW_VER="$((CUR_MAJOR + 1)).0.0" ;;
              minor)  NEW_VER="${CUR_MAJOR}.$((CUR_MINOR + 1)).0" ;;
              hotfix) NEW_VER="${CUR_MAJOR}.${CUR_MINOR}.$((CUR_PATCH + 1))" ;;
              *)      echo "::error::未知的 bump_type：$INPUT_BUMP"; exit 1 ;;
            esac
          fi

          TAG="v${NEW_VER}"
          echo "新版本：${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VER}" >> "$GITHUB_OUTPUT"

      - name: 更新 gradle.properties 版本号
        run: |
          VER="${{ steps.version.outputs.version }}"
          CUR=$(grep -m1 '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$VER" = "$CUR" ]; then
            echo "gradle.properties 已经是 ${VER}，无需写入"
            exit 0
          fi
          sed -i "s/^version=.*/version=${VER}/" gradle.properties
          grep -m1 '^version=' gradle.properties

      - name: 提交版本变更并打 tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "llsgllsg"
          git config user.email "llsgllsg@users.noreply.github.com"

          git add gradle.properties
          if git diff --cached --quiet; then
            echo "版本号无变化，跳过提交"
          else
            git commit -m "release ${TAG}"
          fi

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} 已存在，跳过创建"
          else
            git tag "${TAG}"
          fi

          # tag 推送触发时处于 detached HEAD，此时只推 tag
          if [ "${GITHUB_REF_TYPE:-branch}" = "branch" ]; then
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git push origin --tags

      - name: 构建三个目标
        run: |
          set -e
          for target in 1.21.11 26.2 26.3; do
            echo "::group::构建 MC $target"
            ./gradlew shadowJar "-PmcTarget=$target" --console=plain
            echo "::endgroup::"
          done

      - name: 校验产物
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          for target in 1.21.11 26.2 26.3; do
            JAR="build/libs/Nascraft-${VERSION}-${target}.jar"
            test -f "$JAR" || { echo "::error::缺少产物 $JAR"; exit 1; }

            # issue #3 防回归：随包依赖必须真的在 jar 里，否则装上去就会
            # NoClassDefFoundError: org/bstats/charts/CustomChart
            for entry in \
              me/bounser/bstats/charts/CustomChart.class \
              me/bounser/bstats/bukkit/Metrics.class \
              xyz/xenondevs/invui/gui/AbstractGui.class \
              me/bounser/nbtapi/NBTItem.class
            do
              unzip -l "$JAR" | grep -q "$entry" \
                || { echo "::error::$JAR 缺少随包依赖 $entry"; exit 1; }
            done
            ls -l "$JAR"
          done

      - name: 生成 Release Notes
        id: notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          # 上一个 tag，用来圈出本次涉及的提交
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1)
          if [ "${PREV_TAG}" = "${TAG}" ] || [ -z "${PREV_TAG}" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD | head -1)
          fi

          NOTES_FILE=$(mktemp)
          {
            echo "## Nascraft ${TAG}"
            echo ""
            echo "### 产物说明"
            echo "| 文件 | 适用版本 | Java |"
            echo "|------|----------|------|"
            echo "| Nascraft-${VERSION}-1.21.11.jar | Paper / Purpur 1.21.11 | JDK 21 |"
            echo "| Nascraft-${VERSION}-26.2.jar | Paper / Purpur 26.2 | JDK 25 |"
            echo "| Nascraft-${VERSION}-26.3.jar | Paper / Purpur 26.3 | JDK 25 |"
            echo ""
            echo "### 本次变更"
            git log --pretty=format:'- %s' "${PREV_TAG}..${TAG}" 2>/dev/null || true
            echo ""
            echo ""
            echo "### 安装与更新"
            echo "1. 下载与服务器版本对应的 jar，替换 plugins/ 里的旧 jar"
            echo "2. 不要删除 plugins/Nascraft 数据文件夹（数据库和配置都在里面）"
            echo "3. 若本次更新了语言文件，删除一次 plugins/Nascraft/langs/ 让插件重新生成"
            echo "4. 重启服务器"
          } > "$NOTES_FILE"

          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: 创建 / 更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="${{ steps.notes.outputs.notes_file }}"

          ASSETS=(
            "build/libs/Nascraft-${VERSION}-1.21.11.jar"
            "build/libs/Nascraft-${VERSION}-26.2.jar"
            "build/libs/Nascraft-${VERSION}-26.3.jar"
          )

          if gh release create "${TAG}" "${ASSETS[@]}" \
               --title "Nascraft ${TAG}" \
               --notes-file "${NOTES_FILE}"; then
            echo "Release ${TAG} 创建完成"
          else
            echo "Release 已存在，改为更新产物"
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          fi
