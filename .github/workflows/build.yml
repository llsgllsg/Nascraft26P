name: 构建 Nascraft

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 25（26.2 / 26.3 的编译工具链）
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 设置 JDK 21（Gradle 运行环境）
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 准备构建配置
        run: |
          chmod +x gradlew

          sed -i '/^systemProp\..*roxy/d' gradle.properties
          sed -i '/^org\.gradle\.java\.installations\.paths/d' gradle.properties

          JDK25="${JAVA_HOME_25_X64:-}"
          JDK21="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          if [ -z "$JDK25" ] || [ -z "$JDK21" ]; then
            echo "::error::找不到 JDK 路径（JDK25='$JDK25' JDK21='$JDK21'）"
            exit 1
          fi
          echo "org.gradle.java.installations.paths=${JDK25},${JDK21}" >> gradle.properties

          echo "Gradle 运行在：$JAVA_HOME"
          cat gradle.properties

      - name: 构建三个目标
        run: |
          set -e

          GRADLE_CMD=""
          if ./gradlew --version --console=plain >/dev/null 2>&1; then
            GRADLE_CMD=./gradlew
          else
            echo "Gradle wrapper 下载失败，改用镜像发行版"
            for url in \
              "https://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip" \
              "https://mirrors.huaweicloud.com/gradle/gradle-8.14.3-bin.zip"
            do
              if curl -fsSL --retry 2 --connect-timeout 20 "$url" -o /tmp/gradle.zip \
                && echo "bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531  /tmp/gradle.zip" | sha256sum -c -; then
                unzip -q /tmp/gradle.zip -d "$HOME/.local"
                GRADLE_CMD="$HOME/.local/gradle-8.14.3/bin/gradle"
                break
              fi
            done
          fi
          if [ -z "$GRADLE_CMD" ] || [ ! -x "$GRADLE_CMD" ]; then
            echo "::error::无法获取 Gradle 发行版"
            exit 1
          fi

          for target in 1.21.11 26.2 26.3; do
            echo "::group::构建并测试 MC $target"
            "$GRADLE_CMD" test shadowJar "-PmcTarget=$target" --console=plain
            echo "::endgroup::"
          done

      - name: 校验产物
        run: |
          set -e
          VERSION=$(grep -m1 '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "版本号：$VERSION"
          echo "NASCRAFT_VERSION=$VERSION" >> "$GITHUB_ENV"
          for target in 1.21.11 26.2 26.3; do
            JAR="build/libs/Nascraft-${VERSION}-${target}.jar"
            test -f "$JAR" || { echo "::error::缺少产物 $JAR"; exit 1; }

            # issue #3 防回归：确认随包依赖真的被 shade 进 jar 了。
            # NoClassDefFoundError: org/bstats/charts/CustomChart。
            for entry in \
              me/bounser/bstats/charts/CustomChart.class \
              me/bounser/bstats/bukkit/Metrics.class \
              xyz/xenondevs/invui/gui/AbstractGui.class \
              me/bounser/nbtapi/NBTItem.class
            do
              unzip -l "$JAR" | grep -q "$entry" \
                || { echo "::error::$JAR 缺少随包依赖 $entry"; exit 1; }
            done
            ls -l "$JAR"
          done
          echo "三个目标的 jar 都已生成，且随包依赖完整。"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Nascraft-build

          path: |
            build/libs/Nascraft-${{ env.NASCRAFT_VERSION }}-1.21.11.jar
            build/libs/Nascraft-${{ env.NASCRAFT_VERSION }}-26.2.jar
            build/libs/Nascraft-${{ env.NASCRAFT_VERSION }}-26.3.jar
          if-no-files-found: error
