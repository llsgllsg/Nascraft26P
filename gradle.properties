# ------------------------------------------------------------------
# Nascraft build configuration
# ------------------------------------------------------------------

# Toolchain locations. paper-api 26.2 (mcTarget=26.2) is compiled for Java 25,
# so the 26.2 build needs zulu-25; the 1.21.11 build uses zulu-21.
org.gradle.java.installations.paths=D:/Zulu/zulu-25,D:/Zulu/zulu-21

# Direct outbound connections from Java are intercepted; route all
# dependency resolution through the local Clash proxy.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.*|10.*|192.168.*
systemProp.https.nonProxyHosts=localhost|127.*|10.*|192.168.*
